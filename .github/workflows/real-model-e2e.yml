          uv pip install --system
          "numpy>=2,<3" "opencv-python-headless>=4.11,<6"
          "pydantic>=2.13,<3" "onnx>=1.16,<2" "onnxruntime>=1.29,<2"
          "psutil>=7.2,<8" "pytest>=9,<10" "Pillow>=12,<13"
          "fastapi>=0.141,<1" "httpx>=0.28,<1" "argon2-cffi>=25.1,<26"

      - name: Download immutable official test assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_verified_file.py \
            "https://huggingface.co/nrl-ai/anylearning-labeling-models/resolve/b8abc71ec07279a978cc1682fd91cd50a7d7b207/${MODEL_STEM}.zip" \
            "$ASSET_DIR/${MODEL_STEM}.zip" \
            --sha256 "$ARCHIVE_SHA256" --max-bytes "$ARCHIVE_MAX_BYTES" \
            --timeout-seconds 1800
          python scripts/download_verified_file.py \
            "https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/6ddff4824372906469a7fae2dc3206c7aa4bbaee/assets/dog.jpg" \
            "$ASSET_DIR/dog.jpg" --sha256 "$IMAGE_SHA256" \
            --max-bytes 10485760

      - name: Extract the exact verified graph pair and create portrait case
        shell: bash
        run: |
          set -euo pipefail
          python scripts/extract_verified_zip.py \
            "$ASSET_DIR/${MODEL_STEM}.zip" "$ASSET_DIR" \
            --member "config.yaml:${CONFIG_BYTES}" \
            --member "${MODEL_STEM}.encoder.onnx:${ENCODER_BYTES}" \
            --member "${MODEL_STEM}.decoder.onnx:${DECODER_BYTES}" \
            --remove-archive
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          root = Path(os.environ["ASSET_DIR"])
          with Image.open(root / "dog.jpg") as image:
              image.transpose(Image.Transpose.ROTATE_270).save(
                  root / "dog_portrait.png", format="PNG", optimize=False
              )
          PY

      - name: Run real portrait and landscape validation
        run: >-
          python scripts/validate_real_model.py
          tests/fixtures/inference/real_models/${{ matrix.manifest }}
          --output-root validation-results/${{ runner.os }}/${{ matrix.artifact }}

