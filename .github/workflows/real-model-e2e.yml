name: Real model E2E

on:
  pull_request:
    paths:
      - "anylearning/inference/**"
      - "anylearning/server/**"
      - "scripts/validate_real_model.py"
      - "scripts/validate_real_server.py"
      - "scripts/download_verified_file.py"
      - "scripts/prepare_external_onnx_validation.py"
      - "tests/e2e/test_real_onnx_models_e2e.py"
      - "tests/fixtures/inference/real_models/**"
      - ".github/workflows/real-model-e2e.yml"
  push:
    branches: [develop]
    paths:
      - "anylearning/inference/**"
      - "anylearning/server/**"
      - "scripts/validate_real_model.py"
      - "scripts/validate_real_server.py"
      - "scripts/download_verified_file.py"
      - "scripts/prepare_external_onnx_validation.py"
      - "tests/e2e/test_real_onnx_models_e2e.py"
      - "tests/fixtures/inference/real_models/**"
      - ".github/workflows/real-model-e2e.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-model-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yolox-s:
    name: YOLOX-S / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ASSET_DIR: tests/fixtures/inference/real_models
      MODEL_SHA256: c5c2d13e59ae883e6af3b45daea64af4833a4951c92d116ec270d9ddbe998063
      IMAGE_SHA256: 5a9522051c3cec2bbd2f6323fccba32e8fbf3ddcc2b3e2fd46b04c720bc6f866
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install isolated inference test dependencies
        run: >-
          uv pip install --system
          "numpy>=2,<3" "opencv-python-headless>=4.11,<6"
          "pydantic>=2.13,<3" "onnx>=1.16,<2" "onnxruntime>=1.29,<2"
          "psutil>=7.2,<8" "pytest>=9,<10" "Pillow>=12,<13"
          "fastapi>=0.141,<1" "httpx>=0.28,<1" "argon2-cffi>=25.1,<26"

      - name: Download immutable official test assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_verified_file.py \
            "https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_s.onnx" \
            "$ASSET_DIR/yolox_s.onnx" --sha256 "$MODEL_SHA256" \
            --max-bytes 104857600
          python scripts/download_verified_file.py \
            "https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/6ddff4824372906469a7fae2dc3206c7aa4bbaee/assets/dog.jpg" \
            "$ASSET_DIR/dog.jpg" --sha256 "$IMAGE_SHA256" \
            --max-bytes 10485760

      - name: Run real single-file ONNX validation
        run: >-
          python scripts/validate_real_model.py
          tests/fixtures/inference/real_models/yolox_s_official.json
          --output-root validation-results/${{ runner.os }}/single-file

      - name: Run authenticated server with real single-file ONNX
        run: >-
          python scripts/validate_real_server.py
          tests/fixtures/inference/real_models/yolox_s_official.json
          --output-root validation-results/${{ runner.os }}/server-single-file

      - name: Prepare external-data form of the same real model
        run: >-
          python scripts/prepare_external_onnx_validation.py
          tests/fixtures/inference/real_models/yolox_s.onnx
          tests/fixtures/inference/real_models/yolox_s_official.json
          tests/fixtures/inference/real_models/yolox_s_external

      - name: Run real external-data ONNX validation
        run: >-
          python scripts/validate_real_model.py
          tests/fixtures/inference/real_models/yolox_s_external/manifest.json
          --output-root validation-results/${{ runner.os }}/external-data

      - name: Run authenticated server with real external-data ONNX
        run: >-
          python scripts/validate_real_server.py
          tests/fixtures/inference/real_models/yolox_s_external/manifest.json
          --output-root validation-results/${{ runner.os }}/server-external-data

      - name: Retain visual and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yolox-s-real-model-validation-${{ runner.os }}
          path: validation-results/
          if-no-files-found: error
          retention-days: 30

