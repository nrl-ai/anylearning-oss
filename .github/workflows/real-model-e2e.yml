            "$ASSET_DIR/mobile_sam_20230629.zip" \
            --sha256 "$ARCHIVE_SHA256" --max-bytes 52428800
          python scripts/download_verified_file.py \
            "https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/6ddff4824372906469a7fae2dc3206c7aa4bbaee/assets/dog.jpg" \
            "$ASSET_DIR/dog.jpg" --sha256 "$IMAGE_SHA256" \
            --max-bytes 10485760

      - name: Extract the verified data-only bundle and create portrait case
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          from PIL import Image

          root = Path(os.environ["ASSET_DIR"])
          expected = {
              "config.yaml",
              "mobile_sam.encoder.onnx",
              "sam_vit_h_4b8939.decoder.onnx",
          }
          with zipfile.ZipFile(root / "mobile_sam_20230629.zip") as archive:
              names = {item.filename for item in archive.infolist()}
              if names != expected:
                  raise ValueError("MobileSAM archive members changed")
              archive.extractall(root, members=sorted(expected))
          with Image.open(root / "dog.jpg") as image:
              image.transpose(Image.Transpose.ROTATE_270).save(
                  root / "dog_portrait.png", format="PNG", optimize=False
              )
          PY

      - name: Run real portrait and landscape validation
        run: >-
          python scripts/validate_real_model.py
          tests/fixtures/inference/real_models/mobile_sam_official.json
          --output-root validation-results/${{ runner.os }}/mobile-sam

      - name: Run authenticated server with real portrait and landscape model
        run: >-
