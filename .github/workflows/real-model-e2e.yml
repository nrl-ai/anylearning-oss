      - name: Retain visual and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}-real-model-validation-${{ runner.os }}
          path: validation-results/
          if-no-files-found: error
          retention-days: 30

