          "fastapi>=0.141,<1" "httpx>=0.28,<1" "argon2-cffi>=25.1,<26"

      - name: Download immutable official test assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_verified_file.py \
            "https://huggingface.co/nrl-ai/anylearning-labeling-models/resolve/b8abc71ec07279a978cc1682fd91cd50a7d7b207/mobile_sam_20230629.zip" \
            "$ASSET_DIR/mobile_sam_20230629.zip" \
            --sha256 "$ARCHIVE_SHA256" --max-bytes 52428800
          python scripts/download_verified_file.py \
            "https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/6ddff4824372906469a7fae2dc3206c7aa4bbaee/assets/dog.jpg" \
            "$ASSET_DIR/dog.jpg" --sha256 "$IMAGE_SHA256" \
            --max-bytes 10485760

      - name: Extract the verified data-only bundle and create portrait case
        shell: bash
        run: |
          set -euo pipefail
          python scripts/extract_verified_zip.py \
            "$ASSET_DIR/mobile_sam_20230629.zip" "$ASSET_DIR" \
            --member "config.yaml:235" \
            --member "mobile_sam.encoder.onnx:28157093" \
            --member "sam_vit_h_4b8939.decoder.onnx:16500272" \
            --remove-archive
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          root = Path(os.environ["ASSET_DIR"])
          with Image.open(root / "dog.jpg") as image:
              image.transpose(Image.Transpose.ROTATE_270).save(
                  root / "dog_portrait.png", format="PNG", optimize=False
              )
          PY

      - name: Run real portrait and landscape validation
        run: >-
          python scripts/validate_real_model.py
          tests/fixtures/inference/real_models/mobile_sam_official.json
          --output-root validation-results/${{ runner.os }}/mobile-sam

      - name: Run authenticated server with real portrait and landscape model
        run: >-
          python scripts/validate_real_server.py
          tests/fixtures/inference/real_models/mobile_sam_official.json
          --output-root validation-results/${{ runner.os }}/server-mobile-sam

      - name: Retain visual and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mobile-sam-real-model-validation-${{ runner.os }}
          path: validation-results/
