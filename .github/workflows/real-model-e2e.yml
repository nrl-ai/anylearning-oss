name: Real model E2E

on:
  pull_request:
    paths:
      - "anylearning/inference/**"
      - "anylearning/server/**"
      - "scripts/validate_real_model.py"
      - "scripts/validate_real_server.py"
      - "scripts/download_verified_file.py"
      - "scripts/prepare_external_onnx_validation.py"
      - "scripts/prepare_efficientvit_sam_decoder.py"
      - "scripts/prepare_sam2_encoder.py"
      - "scripts/verify_real_model_matrix.py"
      - "tests/e2e/test_real_onnx_models_e2e.py"
      - "tests/fixtures/inference/real_models/**"
      - ".github/workflows/real-model-e2e.yml"
  push:
    branches: [develop]
    paths:
      - "anylearning/inference/**"
      - "anylearning/server/**"
      - "scripts/validate_real_model.py"
      - "scripts/validate_real_server.py"
      - "scripts/download_verified_file.py"
      - "scripts/prepare_external_onnx_validation.py"
      - "scripts/prepare_efficientvit_sam_decoder.py"
      - "scripts/prepare_sam2_encoder.py"
      - "scripts/verify_real_model_matrix.py"
      - "tests/e2e/test_real_onnx_models_e2e.py"
      - "tests/fixtures/inference/real_models/**"
      - ".github/workflows/real-model-e2e.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: Real-model suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - pull-request
          - efficientvit-sam-larger
          - sam2-larger
          - sam2-1-larger
          - sam-vit-b
          - efficient-sam-s
          - sam3-vit-h

permissions:
  actions: read
  contents: read

concurrency:
  group: real-model-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yolox-s:
    name: YOLOX-S / ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'pull-request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ASSET_DIR: tests/fixtures/inference/real_models
      MODEL_SHA256: c5c2d13e59ae883e6af3b45daea64af4833a4951c92d116ec270d9ddbe998063
      IMAGE_SHA256: 5a9522051c3cec2bbd2f6323fccba32e8fbf3ddcc2b3e2fd46b04c720bc6f866
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install isolated inference test dependencies
        run: >-
          uv pip install --system
          "numpy>=2,<3" "opencv-python-headless>=4.11,<6"
          "pydantic>=2.13,<3" "onnx>=1.16,<2" "onnxruntime>=1.29,<2"
          "psutil>=7.2,<8" "pytest>=9,<10" "Pillow>=12,<13"
          "fastapi>=0.141,<1" "httpx>=0.28,<1" "argon2-cffi>=25.1,<26"

      - name: Download immutable official test assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_verified_file.py \
            "https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_s.onnx" \
            "$ASSET_DIR/yolox_s.onnx" --sha256 "$MODEL_SHA256" \
            --max-bytes 104857600
          python scripts/download_verified_file.py \
            "https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/6ddff4824372906469a7fae2dc3206c7aa4bbaee/assets/dog.jpg" \
            "$ASSET_DIR/dog.jpg" --sha256 "$IMAGE_SHA256" \
            --max-bytes 10485760

      - name: Run real single-file ONNX validation
        run: >-
          python scripts/validate_real_model.py
          tests/fixtures/inference/real_models/yolox_s_official.json
          --output-root validation-results/${{ runner.os }}/single-file

      - name: Run authenticated server with real single-file ONNX
        run: >-
          python scripts/validate_real_server.py
          tests/fixtures/inference/real_models/yolox_s_official.json
          --output-root validation-results/${{ runner.os }}/server-single-file

      - name: Prepare external-data form of the same real model
        run: >-
          python scripts/prepare_external_onnx_validation.py
          tests/fixtures/inference/real_models/yolox_s.onnx
          tests/fixtures/inference/real_models/yolox_s_official.json
          tests/fixtures/inference/real_models/yolox_s_external

      - name: Run real external-data ONNX validation
        run: >-
          python scripts/validate_real_model.py
          tests/fixtures/inference/real_models/yolox_s_external/manifest.json
          --output-root validation-results/${{ runner.os }}/external-data

      - name: Run authenticated server with real external-data ONNX
        run: >-
          python scripts/validate_real_server.py
          tests/fixtures/inference/real_models/yolox_s_external/manifest.json
          --output-root validation-results/${{ runner.os }}/server-external-data

      - name: Retain visual and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yolox-s-real-model-validation-${{ runner.os }}
          path: validation-results/
          if-no-files-found: error
          retention-days: 30

  efficient-sam-ti:
    name: EfficientSAM-Ti / ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'pull-request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ASSET_DIR: tests/fixtures/inference/real_models
      ENCODER_SHA256: 84ed466ffcc5c1f8d08409bc34a23bb364ab2c15e402cb12d4335a42be0e0951
      DECODER_SHA256: a62f8fa5ea080447c0689418d69e58f1e83e0b7adf9c142e2bd9bcc8045c0b11
      IMAGE_SHA256: 5a9522051c3cec2bbd2f6323fccba32e8fbf3ddcc2b3e2fd46b04c720bc6f866
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install isolated inference test dependencies
        run: >-
          uv pip install --system
          "numpy>=2,<3" "opencv-python-headless>=4.11,<6"
          "pydantic>=2.13,<3" "onnx>=1.16,<2" "onnxruntime>=1.29,<2"
          "psutil>=7.2,<8" "pytest>=9,<10" "Pillow>=12,<13"
          "fastapi>=0.141,<1" "httpx>=0.28,<1" "argon2-cffi>=25.1,<26"

      - name: Download immutable official test assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_verified_file.py \
            "https://huggingface.co/yunyangx/EfficientSAM/resolve/d53228e3f6dee607309453f54a22c40c2a10204c/efficientsam_ti_encoder.onnx" \
            "$ASSET_DIR/efficientsam_ti_encoder.onnx" \
            --sha256 "$ENCODER_SHA256" --max-bytes 52428800
          python scripts/download_verified_file.py \
            "https://huggingface.co/yunyangx/EfficientSAM/resolve/d53228e3f6dee607309453f54a22c40c2a10204c/efficientsam_ti_decoder.onnx" \
            "$ASSET_DIR/efficientsam_ti_decoder.onnx" \
            --sha256 "$DECODER_SHA256" --max-bytes 52428800
          python scripts/download_verified_file.py \
            "https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/6ddff4824372906469a7fae2dc3206c7aa4bbaee/assets/dog.jpg" \
            "$ASSET_DIR/dog.jpg" --sha256 "$IMAGE_SHA256" \
            --max-bytes 10485760

      - name: Run real promptable ONNX validation
        run: >-
          python scripts/validate_real_model.py
          tests/fixtures/inference/real_models/efficient_sam_ti_official.json
          --output-root validation-results/${{ runner.os }}/efficient-sam-ti

      - name: Run authenticated server with real promptable ONNX
        run: >-
          python scripts/validate_real_server.py
          tests/fixtures/inference/real_models/efficient_sam_ti_official.json
          --output-root validation-results/${{ runner.os }}/server-efficient-sam-ti

      - name: Retain visual and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: efficient-sam-ti-real-model-validation-${{ runner.os }}
          path: validation-results/
          if-no-files-found: error
          retention-days: 30

  efficientvit-sam-l0:
    name: EfficientViT-SAM-L0 / ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'pull-request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ASSET_DIR: tests/fixtures/inference/real_models
      ENCODER_SHA256: 7a37ebd16e65c31253416e33897e7e6b07699127765d538e99ecbfaa3ad1e727
      SOURCE_DECODER_SHA256: 053e72c5703736a8a8a92482c9990c4a26dde9dcb7ff26b05843cf0bc433f42f
      PREPARED_DECODER_SHA256: adf8028a47950d40cd8add1f11ae31bf33ccd9b94858b7e873ad78311943cdf1
      IMAGE_SHA256: 5a9522051c3cec2bbd2f6323fccba32e8fbf3ddcc2b3e2fd46b04c720bc6f866
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install isolated inference test dependencies
        run: >-
          uv pip install --system
          "numpy>=2,<3" "opencv-python-headless>=4.11,<6"
          "pydantic>=2.13,<3" "onnx>=1.16,<2" "onnxruntime>=1.29,<2"
          "psutil>=7.2,<8" "pytest>=9,<10" "Pillow>=12,<13"
          "fastapi>=0.141,<1" "httpx>=0.28,<1" "argon2-cffi>=25.1,<26"

      - name: Download immutable official test assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_verified_file.py \
            "https://huggingface.co/mit-han-lab/efficientvit-sam/resolve/a2f0c5929196a13ef1ffc9338d3f9e482e1e0e68/onnx/l0_encoder.onnx" \
            "$ASSET_DIR/efficientvit_sam_l0_encoder.onnx" \
            --sha256 "$ENCODER_SHA256" --max-bytes 157286400
          python scripts/download_verified_file.py \
            "https://huggingface.co/mit-han-lab/efficientvit-sam/resolve/a2f0c5929196a13ef1ffc9338d3f9e482e1e0e68/onnx/l0_decoder.onnx" \
            "$ASSET_DIR/efficientvit_sam_l0_decoder_official.onnx" \
            --sha256 "$SOURCE_DECODER_SHA256" --max-bytes 33554432
          python scripts/download_verified_file.py \
            "https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/6ddff4824372906469a7fae2dc3206c7aa4bbaee/assets/dog.jpg" \
            "$ASSET_DIR/dog.jpg" --sha256 "$IMAGE_SHA256" \
            --max-bytes 10485760

      - name: Prepare verified native-multimask decoder and portrait case
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_efficientvit_sam_decoder.py \
            "$ASSET_DIR/efficientvit_sam_l0_decoder_official.onnx" \
            "$ASSET_DIR/efficientvit_sam_l0_decoder_multimask.onnx" \
            --source-sha256 "$SOURCE_DECODER_SHA256" \
            --expected-output-sha256 "$PREPARED_DECODER_SHA256" --force
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          root = Path(os.environ["ASSET_DIR"])
          with Image.open(root / "dog.jpg") as image:
              image.transpose(Image.Transpose.ROTATE_270).save(
                  root / "dog_portrait.png", format="PNG", optimize=False
              )
          PY

      - name: Run real landscape and portrait validation
        run: >-
          python scripts/validate_real_model.py
          tests/fixtures/inference/real_models/efficientvit_sam_l0_official.json
          --output-root validation-results/${{ runner.os }}/efficientvit-sam-l0

      - name: Run authenticated server with the real model
        run: >-
          python scripts/validate_real_server.py
          tests/fixtures/inference/real_models/efficientvit_sam_l0_official.json
          --output-root validation-results/${{ runner.os }}/server-efficientvit-sam-l0

      - name: Retain visual and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: efficientvit-sam-l0-real-model-validation-${{ runner.os }}
          path: validation-results/
          if-no-files-found: error
          retention-days: 30

  efficientvit-sam-l0-consistency:
    name: EfficientViT-SAM-L0 cross-platform identity
    needs: efficientvit-sam-l0
    if: always() && needs.efficientvit-sam-l0.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install image verification dependency
        run: python -m pip install "Pillow>=12,<13"

      - name: Download all L0 operating-system reports
        uses: actions/download-artifact@v6
        with:
          pattern: efficientvit-sam-l0-real-model-validation-*
          path: matrix-artifacts

      - name: Verify transport and cross-platform decoded pixels
        run: >-
          python scripts/verify_real_model_matrix.py matrix-artifacts
          --artifact-prefix efficientvit-sam
          --variant l0
          --platform Linux --platform Windows --platform macOS
          --output matrix-verification/efficientvit-sam-l0.json

      - name: Retain the matrix verification report
        uses: actions/upload-artifact@v6
        with:
          name: efficientvit-sam-l0-matrix-verification
          path: matrix-verification/
          if-no-files-found: error
          retention-days: 30

  efficientvit-sam-larger:
    name: EfficientViT-SAM-${{ matrix.display }} / ${{ matrix.os }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'efficientvit-sam-larger'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        variant: [l1, l2, xl0, xl1]
        include:
          - variant: l1
            display: L1
            encoder_sha256: 54fb7d5a57476945ee7b95c4b171d6612b6be202dc84c6eb13e41c3ad30172c9
            source_decoder_sha256: fa37312a0b7789c06f5e9e674f8d64eadaca446202b51ae94ae91e0229574b94
            prepared_decoder_sha256: c09ba27d601403540bc11ba3518b744264a9bf138cedb8584a620d09f912e83d
            encoder_max_bytes: 209715200
            manifest: efficientvit_sam_l1_official.json
            artifact: efficientvit-sam-l1
          - variant: l2
            display: L2
            encoder_sha256: daec3f2f887ce6135d7e6119846025c4500f35c6474fd005b41c90e26d7581cf
            source_decoder_sha256: 3327ec112dc57daf08eab09c82a9c8f30e6dc7006007107ad56564abdb9e31db
            prepared_decoder_sha256: d1f161cbfa50002491c7c582bfc5e8b68c304b38102f06ef91702a13c2607c16
            encoder_max_bytes: 268435456
            manifest: efficientvit_sam_l2_official.json
            artifact: efficientvit-sam-l2
          - variant: xl0
            display: XL0
            encoder_sha256: b39add8f7e2f8a612af867e864d962eff5ac98c8336b32feca08327a89cc8de3
            source_decoder_sha256: 051bfae9a07c1ff180fd7c5238334fdc45eaa0227c46f29740d98662865e01f7
            prepared_decoder_sha256: 705331ee9bb616d2fb5afa8ef959c59e55a8e5b6baef71516c759ae3972e407f
            encoder_max_bytes: 536870912
            manifest: efficientvit_sam_xl0_official.json
            artifact: efficientvit-sam-xl0
          - variant: xl1
            display: XL1
            encoder_sha256: eb281937fbd06645fb3cafc09c34c6b729dc7167a33a73356b9d69af071e5b04
            source_decoder_sha256: cf20b6701054335e5392ac5f196cc8f6aaa8e7daa6d7f709e1880976e069cfcf
            prepared_decoder_sha256: e2dae95e7e91bdd3c0d52133c9e12d3a420eb3a035204e8d92499380ae1d22b9
            encoder_max_bytes: 1073741824
            manifest: efficientvit_sam_xl1_official.json
            artifact: efficientvit-sam-xl1
    env:
      ASSET_DIR: tests/fixtures/inference/real_models
      IMAGE_SHA256: 5a9522051c3cec2bbd2f6323fccba32e8fbf3ddcc2b3e2fd46b04c720bc6f866
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install isolated inference test dependencies
        run: >-
          uv pip install --system
          "numpy>=2,<3" "opencv-python-headless>=4.11,<6"
          "pydantic>=2.13,<3" "onnx>=1.16,<2" "onnxruntime>=1.29,<2"
          "psutil>=7.2,<8" "pytest>=9,<10" "Pillow>=12,<13"
          "fastapi>=0.141,<1" "httpx>=0.28,<1" "argon2-cffi>=25.1,<26"

      - name: Download immutable official variant
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_verified_file.py \
            "https://huggingface.co/mit-han-lab/efficientvit-sam/resolve/a2f0c5929196a13ef1ffc9338d3f9e482e1e0e68/onnx/${{ matrix.variant }}_encoder.onnx" \
            "$ASSET_DIR/efficientvit_sam_${{ matrix.variant }}_encoder.onnx" \
            --sha256 "${{ matrix.encoder_sha256 }}" \
            --max-bytes "${{ matrix.encoder_max_bytes }}"
          python scripts/download_verified_file.py \
            "https://huggingface.co/mit-han-lab/efficientvit-sam/resolve/a2f0c5929196a13ef1ffc9338d3f9e482e1e0e68/onnx/${{ matrix.variant }}_decoder.onnx" \
            "$ASSET_DIR/efficientvit_sam_${{ matrix.variant }}_decoder_official.onnx" \
            --sha256 "${{ matrix.source_decoder_sha256 }}" \
            --max-bytes 33554432
          python scripts/download_verified_file.py \
            "https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/6ddff4824372906469a7fae2dc3206c7aa4bbaee/assets/dog.jpg" \
            "$ASSET_DIR/dog.jpg" --sha256 "$IMAGE_SHA256" \
            --max-bytes 10485760

      - name: Prepare verified native-multimask decoder and portrait case
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_efficientvit_sam_decoder.py \
            "$ASSET_DIR/efficientvit_sam_${{ matrix.variant }}_decoder_official.onnx" \
            "$ASSET_DIR/efficientvit_sam_${{ matrix.variant }}_decoder_multimask.onnx" \
            --source-sha256 "${{ matrix.source_decoder_sha256 }}" \
            --expected-output-sha256 "${{ matrix.prepared_decoder_sha256 }}" \
            --force
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          root = Path(os.environ["ASSET_DIR"])
          with Image.open(root / "dog.jpg") as image:
              image.transpose(Image.Transpose.ROTATE_270).save(
                  root / "dog_portrait.png", format="PNG", optimize=False
              )
          PY

      - name: Run real landscape and portrait validation
        run: >-
          python scripts/validate_real_model.py
          tests/fixtures/inference/real_models/${{ matrix.manifest }}
          --output-root validation-results/${{ runner.os }}/${{ matrix.artifact }}

      - name: Run authenticated server with the real model
        run: >-
          python scripts/validate_real_server.py
          tests/fixtures/inference/real_models/${{ matrix.manifest }}
          --output-root validation-results/${{ runner.os }}/server-${{ matrix.artifact }}

      - name: Retain visual and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}-real-model-validation-${{ runner.os }}
          path: validation-results/
          if-no-files-found: error
          retention-days: 30

  efficientvit-sam-larger-consistency:
    name: EfficientViT-SAM larger cross-platform identity
    needs: efficientvit-sam-larger
    if: always() && needs.efficientvit-sam-larger.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install image verification dependency
        run: python -m pip install "Pillow>=12,<13"

      - name: Download all larger-variant operating-system reports
        uses: actions/download-artifact@v6
        with:
          pattern: efficientvit-sam-*-real-model-validation-*
          path: matrix-artifacts

      - name: Verify transport and cross-platform decoded pixels
        run: >-
          python scripts/verify_real_model_matrix.py matrix-artifacts
          --artifact-prefix efficientvit-sam
          --variant l1 --variant l2 --variant xl0 --variant xl1
          --platform Linux --platform Windows --platform macOS
          --output matrix-verification/efficientvit-sam-larger.json

      - name: Retain the matrix verification report
        uses: actions/upload-artifact@v6
        with:
          name: efficientvit-sam-larger-matrix-verification
          path: matrix-verification/
          if-no-files-found: error
          retention-days: 30

  mobile-sam:
    name: MobileSAM aspect ratios / ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'pull-request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ASSET_DIR: tests/fixtures/inference/real_models
      ARCHIVE_SHA256: 41aff2660b7531becfee21fb257c49933ddc892c554507bdb775bf504d443942
      IMAGE_SHA256: 5a9522051c3cec2bbd2f6323fccba32e8fbf3ddcc2b3e2fd46b04c720bc6f866
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install isolated inference test dependencies
