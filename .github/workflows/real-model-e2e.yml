  sam2-larger:
    name: SAM2 Hiera-${{ matrix.display }} / ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        variant: [small, base-plus, large]
        include:
          - variant: small
            display: Small
            stem: sam2_hiera_small
            archive_sha256: 4ef9047eb7fc7e36041c88a9f968c3c0b1d1640b88ef66d754b7d558a10cee38
            archive_max_bytes: 209715200
            encoder_bytes: 162703493
            decoder_bytes: 20640886
            config_bytes: 252
            manifest: sam2_hiera_small_official.json
            artifact: sam2-hiera-small
          - variant: base-plus
            display: Base+
            stem: sam2_hiera_base_plus
            archive_sha256: c56282103c2bf99bdab07d2dddb1be67c03d71659ade3f9dcf1d7001fda582fb
            archive_max_bytes: 419430400
            encoder_bytes: 339781223
            decoder_bytes: 20640886
            config_bytes: 264
            manifest: sam2_hiera_base_plus_official.json
            artifact: sam2-hiera-base-plus
          - variant: large
            display: Large
            stem: sam2_hiera_large
            archive_sha256: a967ef6e54794e9494c8b71201766532b7b2929fe18f56b8e63940e97dc671ac
            archive_max_bytes: 1073741824
            encoder_bytes: 889361980
            decoder_bytes: 20640910
            config_bytes: 252
            manifest: sam2_hiera_large_official.json
            artifact: sam2-hiera-large
    env:
      ASSET_DIR: tests/fixtures/inference/real_models
      MODEL_STEM: ${{ matrix.stem }}
      ARCHIVE_SHA256: ${{ matrix.archive_sha256 }}
      ARCHIVE_MAX_BYTES: ${{ matrix.archive_max_bytes }}
      ENCODER_BYTES: ${{ matrix.encoder_bytes }}
      DECODER_BYTES: ${{ matrix.decoder_bytes }}
      CONFIG_BYTES: ${{ matrix.config_bytes }}
      MANIFEST: ${{ matrix.manifest }}
      ARTIFACT: ${{ matrix.artifact }}
      IMAGE_SHA256: 5a9522051c3cec2bbd2f6323fccba32e8fbf3ddcc2b3e2fd46b04c720bc6f866
