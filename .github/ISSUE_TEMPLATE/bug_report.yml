name: Bug report
description: Report a reproducible problem in AnyLearning
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search existing issues before filing a new report.
  - type: input
    id: version
    attributes:
      label: AnyLearning version or commit
      placeholder: 0.26.3 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and the smallest reproduction you can provide.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private datasets, access tokens, keys, and personal information from this report.
          required: true
